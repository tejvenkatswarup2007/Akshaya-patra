<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Akshaya Patra - Sign Up</title>

    <style>

        body {
            margin: 0;
            font-family: Arial;
            background-color: #eef8ee;
        }

        /* Header */

        header {
            background-color: white;
            padding: 12px 25px;
        }

        header img {
            width: 150px;
            height: 150px;
        }

        /* Form */

        .box {
            width: 400px;
            margin: 35px auto;
            background-color: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0px 2px 10px gray;
        }

        .box h1 {
            text-align: center;
            color: green;
        }

        .box p {
            text-align: center;
        }

        label {
            display: block;
            margin-top: 12px;
        }

        input, select, textarea {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            box-sizing: border-box;
        }

        textarea {
            height: 70px;
        }

        .register {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            background-color: green;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
        }

        .home {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: green;
            text-decoration: none;
        }

        /* Success Message */

        .success {
            display: none;
            background-color: #d4edda;
            color: green;
            padding: 15px;
            text-align: center;
            margin: 20px auto;
            width: 400px;
            border-radius: 8px;
        }

        /* Footer */

        footer {
            background-color: #166b35;
            color: white;
            text-align: center;
            padding: 20px;
            margin-top: 40px;
        }

        footer img {
            width: 500px;
            height: 320px;
            object-fit: cover;
            border-radius: 8px;
        }

    </style>

</head>


<body>


    <!-- Logo -->

    <header>

        <img src="img1.jpeg" alt="Akshaya Patra Logo">

    </header>


    <!-- Registration Form -->

    <div class="box">

        <h1>Donor Sign Up</h1>

        <p>
            Join Akshaya Patra and help people through food sharing.
        </p>


        <form id="signupForm">


            <label>Full Name</label>

            <input type="text"
                   placeholder="Enter your full name"
                   required>


            <label>Email</label>

            <input type="email"
                   placeholder="Enter your email"
                   required>


            <label>Phone Number</label>

            <input type="tel"
                   placeholder="Enter your phone number"
                   required>


            <label>Donor Type</label>

            <select required>

                <option value="">Select Donor Type</option>

                <option>Individual</option>

                <option>Restaurant</option>

                <option>Hotel</option>

                <option>Organization</option>

            </select>


            <label>City</label>

            <input type="text"
                   placeholder="Enter your city"
                   required>


            <label>Address</label>

            <textarea
                placeholder="Enter your address"
                required></textarea>


            <label>Password</label>

            <input type="password"
                   placeholder="Create a password"
                   required>


            <button class="register" type="submit">
                Create Account
            </button>


        </form>


        <a href="index.html" class="home">
            ← Back to Home
        </a>

    </div>


    <!-- Success Banner -->

    <div class="success" id="successMessage">

        <h2>✓ Successfully Registered!</h2>

        <p>Welcome to Akshaya Patra.</p>

    </div>


    <!-- Footer -->

    <footer>

        <img src="img5.png" alt="Food Sharing">

        <h3>Akshaya Patra</h3>

        <p>
            Share Food • Help People • Reduce Waste
        </p>

        <p>
            Good Food Should Feed People, Not Landfills.
        </p>

        <p>
            © 2026 Akshaya Patra
        </p>

    </footer>


    <!-- JavaScript -->

    <script>

        document.getElementById("signupForm").onsubmit = function(event) {

            event.preventDefault();

            document.getElementById("successMessage").style.display = "block";

        };

    </script>


</body>

</html>
